<div class="container" style="margin-top: 7px;">
	<app-notify [type]="typeResponse" [listMessage]="listMessageResponse"></app-notify>
	<div class="card">
		<div class="card-header">
			<h5>Listar Usuarios</h5>
		</div>
		<div class="card-body" style="min-height: 400px;">
			<table class="table table-striped">
				<thead>
					<tr>
						<th>NOMBRE</th>
						<th>Email</th>
						<th></th>
					</tr>
				</thead>
				<tbody>
					<tr *ngFor="let item of listUser">
						<td>{{item.nameUser}}</td>
						<td>{{item.email}}</td>
						<td><button class="btn btn-xs btn-danger">Eliminar</button></td>
					</tr> 
				</tbody>
			</table>
		</div>
	</div>
</div>
